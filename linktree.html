<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080a0b">
    <meta name="description" content="Photography, films, and social links from Timothy Do — TheDoShoots.">
    <title>Links — TheDoShoots</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='58'%3E%F0%9F%8C%B2%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --ink: #050505;
            --panel: rgba(20, 20, 20, 0.75);
            --paper: #f1f0ea;
            --cyan: #00e5ff;
            --muted: #92999c;
            --line: rgba(255, 255, 255, 0.12);
            --glass-bg: rgba(20, 20, 20, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--ink); }

        body {
            min-height: 100vh;
            margin: 0;
            color: #fff;
            background: var(--ink);
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }
        button { font: inherit; }

        .shell {
            display: grid;
            grid-template-columns: minmax(330px, 44vw) 1fr;
            min-height: 100svh;
        }

        .content {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: clamp(30px, 5vw, 74px) clamp(24px, 7vw, 104px) 34px;
            background:
                radial-gradient(circle at 88% 5%, rgba(0, 223, 247, 0.08), transparent 26%),
                var(--panel);
        }

        .content::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");
        }

        .content-inner { position: relative; width: min(100%, 720px); margin: auto; }

        .utility {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: clamp(40px, 7vh, 76px);
        }

        .profile { display: flex; align-items: center; gap: 13px; }

        .avatar {
            width: 50px;
            height: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-copy strong { display: block; font-size: 0.83rem; font-weight: 600; }
        .profile-copy span { color: var(--muted); font-size: 0.7rem; }

        .share-button {
            display: inline-flex;
            width: 42px;
            height: 42px;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #dce0e1;
            cursor: pointer;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.025);
            transition: color .2s, border-color .2s, transform .2s;
        }

        .share-button:hover { color: var(--cyan); border-color: rgba(0, 223, 247, 0.6); transform: rotate(-8deg); }
        .share-button svg { width: 17px; height: 17px; }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 13px;
            color: var(--cyan);
            font-size: 0.67rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }

        h1 {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            font-size: clamp(4rem, 9vw, 8.5rem);
            font-weight: 800;
            line-height: 0.78;
            letter-spacing: -0.085em;
        }

        h1 span { color: var(--cyan); }

        .link-list { border-top: 1px solid var(--line); }

        .feature-link {
            position: relative;
            display: flex;
            min-height: 170px;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 12px;
            padding: 25px 27px;
            overflow: hidden;
            isolation: isolate;
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 7px;
            background: #101516;
        }

        .feature-link::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -2;
            background: url('./assets/starshalo.jpg') center 42% / cover;
            transition: transform .7s cubic-bezier(.2,.75,.25,1);
        }

        .feature-link::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(90deg, rgba(4, 7, 8, .94), rgba(4, 7, 8, .38));
        }

        .feature-link:hover::before { transform: scale(1.045); }
        .feature-link:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

        .feature-meta span {
            display: block;
            margin-bottom: 8px;
            color: var(--cyan);
            font-size: .61rem;
            font-weight: 700;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .feature-meta span i { width: 18px; margin-right: 7px; text-align: center; }

        .feature-meta strong {
            display: block;
            font-family: 'Roboto', sans-serif;
            font-size: clamp(1.35rem, 2.6vw, 1.8rem);
            letter-spacing: -.035em;
        }

        .feature-link .arrow { flex: 0 0 auto; color: #071012; border-color: var(--cyan); background: var(--cyan); }
        .feature-link:hover .arrow { transform: translate(3px, -3px); }

        .link-row {
            position: relative;
            display: grid;
            grid-template-columns: 42px 1fr auto;
            align-items: center;
            gap: 18px;
            min-height: 86px;
            padding: 13px 2px;
            overflow: hidden;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid var(--line);
        }

        .link-row::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(90deg, rgba(0, 223, 247, 0.11), transparent 72%);
            transform: translateX(-104%);
            transition: transform .4s cubic-bezier(.2,.75,.25,1);
        }

        .link-row:hover::before,
        .link-row:focus-visible::before { transform: translateX(0); }

        .link-row:focus-visible { outline: 1px solid var(--cyan); outline-offset: 3px; }

        .index {
            color: #666d70;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.12em;
        }

        .link-icon {
            width: 42px;
            color: var(--cyan);
            font-size: 1rem;
            text-align: center;
        }

        .link-label strong {
            display: block;
            margin-bottom: 4px;
            font-family: 'Roboto', sans-serif;
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .link-label small { display: block; color: #7f878a; font-size: 0.72rem; }

        .arrow {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            color: var(--cyan);
            border: 1px solid rgba(0, 223, 247, 0.28);
            border-radius: 50%;
            transition: color .25s, background .25s, transform .25s;
        }

        .link-row:hover .arrow { color: #071012; background: var(--cyan); transform: translate(2px, -2px); }

        .link-row.contact {
            margin-top: 12px;
            padding-right: 14px;
            padding-left: 14px;
            border: 1px solid var(--cyan);
            border-radius: 7px;
            background: var(--cyan);
        }

        .link-row.contact::before { display: none; }
        .link-row.contact .index,
        .link-row.contact .link-label small { color: rgba(5, 15, 17, .62); }
        .link-row.contact .link-icon { color: #071012; }
        .link-row.contact .link-label strong { color: #071012; }
        .link-row.contact .arrow { color: #071012; border-color: rgba(7, 16, 18, .28); }
        .link-row.contact:hover .arrow { color: var(--cyan); background: #071012; }

        .social-section { margin-top: 32px; }

        .socials { display: flex; flex-wrap: wrap; column-gap: 20px; row-gap: 9px; }

        .socials a {
            position: relative;
            padding: 5px 0;
            color: #aeb4b6;
            font-size: 0.7rem;
            text-decoration: none;
            transition: color .2s;
        }

        .socials a::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 1px;
            left: 0;
            height: 1px;
            background: var(--cyan);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .2s;
        }

        .socials a:hover { color: var(--cyan); }
        .socials a:hover::after { transform: scaleX(1); }
        .socials a:focus-visible { color: var(--cyan); outline: 1px solid var(--cyan); outline-offset: 4px; }

        footer {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 42px;
            color: #555c5f;
            font-size: 0.63rem;
        }

        footer a { color: inherit; text-decoration: none; }
        footer a:hover { color: var(--cyan); }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 5;
            padding: 11px 16px;
            color: #071012;
            font-size: 0.72rem;
            font-weight: 700;
            border-radius: 99px;
            background: var(--cyan);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity .2s, transform .2s;
        }

        .toast.visible { opacity: 1; transform: translateY(0); }

        @keyframes settle {
            from { opacity: 0; transform: scale(1.07); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 800px) {
            .shell { display: block; }
            .visual { height: 43svh; min-height: 330px; }
            .visual-top { top: 25px; }
            .visual-bottom { bottom: 76px; }
            .field-note { display: none; }
            .content {
                min-height: 60svh;
                margin-top: -48px;
                padding: 27px 22px calc(28px + env(safe-area-inset-bottom));
                border-radius: 28px 28px 0 0;
            }
            .content-inner { margin: 0 auto; }
            .utility { margin-bottom: 45px; }
            h1 { font-size: clamp(4rem, 23vw, 6.5rem); }
            footer { margin-top: 36px; }
        }

        @media (max-width: 400px) {
            .visual { height: 39svh; min-height: 285px; }
            .visual-bottom { display: none; }
            .content { margin-top: -35px; }
            .link-row { grid-template-columns: 30px 1fr auto; gap: 12px; min-height: 80px; }
            .link-label small { max-width: 195px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }

        /* Focused link-in-bio layout */
        body {
            overflow-x: hidden;
            position: relative;
            isolation: isolate;
            background: #020405;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: -2;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(circle at 20% 16%, rgba(0, 223, 247, .24), transparent 26%),
                radial-gradient(circle at 82% 35%, rgba(91, 46, 255, .2), transparent 28%),
                radial-gradient(circle at 45% 88%, rgba(0, 150, 125, .16), transparent 30%),
                linear-gradient(145deg, #020405 20%, #071013 58%, #020304 100%);
            animation: backgroundDrift 18s ease-in-out infinite alternate;
        }

        body::after {
            z-index: -1;
            inset: 0;
            opacity: .3;
            background-image:
                radial-gradient(1px 1px at 12% 18%, #fff 45%, transparent 52%),
                radial-gradient(1px 1px at 78% 12%, #00dff7 45%, transparent 52%),
                radial-gradient(1px 1px at 63% 47%, #fff 45%, transparent 52%),
                radial-gradient(1px 1px at 25% 72%, #00dff7 45%, transparent 52%),
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 280px 280px, 340px 340px, 410px 410px, 370px 370px, 44px 44px, 44px 44px;
            animation: starDrift 32s linear infinite;
        }

        /* Shared visual language with about.html */
        body::before,
        body::after { display: none; }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-stars {
            opacity: .22;
            background-image:
                radial-gradient(1px 1px at 10% 10%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 20% 40%, #ffffff80, transparent),
                radial-gradient(1px 1px at 40% 70%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 60% 30%, #ffffff80, transparent),
                radial-gradient(1px 1px at 80% 80%, #fff, transparent);
            background-size: 300px 300px;
            animation: linkStarDrift 34s linear infinite, linkStarPulse 6s ease-in-out infinite alternate;
        }

        .bg-aurora {
            background:
                radial-gradient(ellipse at 15% -5%, rgba(0, 229, 255, .2), transparent 43%),
                radial-gradient(ellipse at 90% 8%, rgba(128, 58, 255, .17), transparent 46%),
                linear-gradient(180deg, #061014 0%, transparent 48%);
        }

        .bg-aurora::before,
        .bg-aurora::after {
            content: "";
            position: absolute;
            left: -18%;
            top: -22%;
            width: 136%;
            height: 72%;
            transform-origin: 50% 0;
        }

        .bg-aurora::before {
            border-radius: 0 0 48% 52%;
            opacity: .86;
            filter: blur(34px);
            background: repeating-linear-gradient(112deg, transparent 0 8%, rgba(0,229,255,.04) 12%, rgba(91,255,185,.28) 17%, rgba(64,136,255,.12) 22%, transparent 29% 38%);
            animation: linkAuroraSweep 13s ease-in-out infinite alternate;
        }

        .bg-aurora::after {
            top: -12%;
            border-radius: 0 0 55% 45%;
            opacity: .65;
            filter: blur(45px);
            background: repeating-linear-gradient(74deg, transparent 0 12%, rgba(109,37,255,.03) 17%, rgba(143,70,255,.22) 22%, rgba(0,229,255,.16) 27%, transparent 34% 46%);
            animation: linkAuroraFold 17s ease-in-out infinite alternate-reverse;
        }

        .shell {
            display: block;
            position: relative;
            z-index: 1;
            width: min(100%, 720px);
            min-height: 100svh;
            margin: 0 auto;
        }

        .visual { display: none; }

        .content {
            min-height: 100svh;
            padding: 48px 20px calc(32px + env(safe-area-inset-bottom));
            background: transparent;
        }

        .content::before { position: fixed; }
        .content-inner {
            display: flex;
            width: min(calc(100vw - 40px), 620px);
            max-width: 100%;
            min-width: 0;
            margin: 0 auto;
            flex-direction: column;
        }

        .content-inner > a[aria-label="TheDoShoots home"] {
            order: 1;
            animation: logoReveal .8s cubic-bezier(.2,.8,.2,1) both;
        }
        .content-inner > .eyebrow { order: 2; }
        .content-inner > .social-section { order: 4; }
        .content-inner > nav[aria-label="Featured links"] { order: 5; }
        .content-inner > footer { order: 6; }

        .linktree-logo {
            display: block;
            width: min(94%, 480px);
            height: auto;
            margin: 0 auto 30px;
            filter: drop-shadow(0 8px 24px rgba(0, 223, 247, .12));
            animation: logoFloat 6s ease-in-out infinite;
        }

        .utility {
            position: relative;
            justify-content: center;
            margin-bottom: 22px;
        }

        .profile { flex-direction: column; gap: 12px; text-align: center; }

        .avatar {
            width: 94px;
            height: 94px;
            padding: 3px;
            border: 2px solid rgba(255, 255, 255, 0.82);
            box-shadow: 0 10px 38px rgba(0, 0, 0, 0.38);
            animation: profileIn .7s cubic-bezier(.2,.8,.2,1) both;
            transition: transform .3s, box-shadow .3s;
        }

        .avatar:hover { transform: scale(1.07) rotate(2deg); box-shadow: 0 12px 42px rgba(0, 223, 247, .22); }

        .profile-copy strong { font-family: 'Roboto', sans-serif; font-size: 1.12rem; }
        .profile-copy span { display: block; margin-top: 3px; font-size: .76rem; }

        .share-button { position: absolute; top: 0; right: 0; background: rgba(255, 255, 255, .06); }
        .eyebrow { display: none; }

        h1 {
            font-size: clamp(2rem, 9vw, 3rem);
            line-height: 1;
            letter-spacing: -.045em;
            text-align: center;
        }

        .link-list { display: grid; gap: 12px; border: 0; }

        .feature-link,
        .link-row,
        .link-row.contact {
            min-height: 76px;
            margin: 0 0 12px;
            padding: 13px 15px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 15px;
            background: var(--glass-bg);
            box-shadow: 0 7px 24px rgba(0, 0, 0, .16);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            transition: transform .2s, border-color .2s, background .2s;
            animation: cardIn .65s cubic-bezier(.2,.8,.2,1) both;
        }

        .feature-link { animation-delay: .12s; }
        .link-list .link-row:nth-child(1) { animation-delay: .2s; }
        .link-list .link-row:nth-child(2) { animation-delay: .28s; }
        .link-list .link-row:nth-child(3) { animation-delay: .36s; }
        .link-list .link-row:nth-child(4) { animation-delay: .44s; }

        .feature-link { min-height: 112px; padding: 20px; }
        .feature-link::after { background: linear-gradient(90deg, rgba(4, 7, 8, .9), rgba(4, 7, 8, .48)); }

        .feature-link:hover,
        .link-row:hover {
            border-color: rgba(0, 223, 247, .68);
            background: rgba(0, 223, 247, .1);
            transform: translateY(-2px);
        }

        .link-row::before { display: none; }
        .link-row.contact .index,
        .link-row.contact .link-label small { color: #7f878a; }
        .link-row.contact .link-icon,
        .link-row.contact .link-label strong { color: inherit; }
        .link-row.contact .arrow { color: var(--cyan); border-color: rgba(0, 223, 247, .28); }

        .social-section { margin: 0 0 30px; text-align: center; }
        .socials { justify-content: center; align-items: center; gap: 10px; }

        .socials a {
            display: inline-flex;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: rgba(255, 255, 255, .72);
            border: 1px solid var(--line);
            border-radius: 50%;
            background: rgba(255, 255, 255, .035);
            animation: socialIn .5s cubic-bezier(.2,.8,.2,1) both;
            transition: color .2s, border-color .2s, background .2s, transform .2s;
        }

        .socials a:nth-child(1) { animation-delay: .48s; }
        .socials a:nth-child(2) { animation-delay: .53s; }
        .socials a:nth-child(3) { animation-delay: .58s; }
        .socials a:nth-child(4) { animation-delay: .63s; }
        .socials a:nth-child(5) { animation-delay: .68s; }
        .socials a:nth-child(6) { animation-delay: .73s; }
        .socials a:nth-child(7) { animation-delay: .78s; }
        .socials a:nth-child(8) { animation-delay: .83s; }

        .socials a:hover,
        .socials a:focus-visible {
            color: #020405;
            border-color: var(--cyan);
            background: var(--cyan);
            transform: translateY(-4px) scale(1.08);
            outline: none;
            box-shadow: 0 8px 22px rgba(0, 223, 247, .25);
        }

        .socials svg {
            display: block;
            width: 21px;
            height: 21px;
            margin: 0;
            vertical-align: 0;
            flex: 0 0 21px;
        }

        .socials i { font-size: 21px; line-height: 1; }

        .socials a::after { display: none; }
        footer { justify-content: center; flex-wrap: wrap; margin-top: 34px; }

        @keyframes backgroundDrift {
            from { transform: translate3d(-2%, -1%, 0) scale(1); filter: hue-rotate(0deg); }
            to { transform: translate3d(3%, 2%, 0) scale(1.06); filter: hue-rotate(12deg); }
        }

        @keyframes linkStarDrift {
            to { background-position: 90px 150px; }
        }

        @keyframes linkStarPulse {
            from { opacity: .16; }
            to { opacity: .31; }
        }

        @keyframes linkAuroraSweep {
            from { transform: translate3d(-7%, -3%, 0) skewX(-7deg) scaleY(.9); opacity: .52; }
            to { transform: translate3d(9%, -1%, 0) skewX(-2deg) scaleY(1.02); opacity: .68; }
        }

        @keyframes linkAuroraFold {
            from { transform: translate3d(8%, 2%, 0) rotate(-3deg) scaleX(.94); opacity: .4; }
            to { transform: translate3d(-10%, -2%, 0) rotate(-1deg) scaleX(1); opacity: .55; }
        }

        @keyframes starDrift {
            to { background-position: 90px 130px, -100px 80px, 70px -120px, -80px -100px, 44px 44px, 44px 44px; }
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        @keyframes logoReveal {
            from { opacity: 0; transform: translateY(-14px) scale(.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes profileIn {
            from { opacity: 0; transform: scale(.82); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px) scale(.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes socialIn {
            from { opacity: 0; transform: translateY(10px) scale(.8); }
