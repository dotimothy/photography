<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Template</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    <link href='https://fonts.googleapis.com/css?family=Roboto:300,400,900' rel='stylesheet' type='text/css'>

    <!-- External Libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- App CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Modal Styles */
        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #settings-modal.hidden {
            display: none;
        }

        .modal-content {
            background: #111;
            border: 2px solid white;
            padding: 30px;
            width: 300px;
            color: white;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        /* Simple Checkbox */
        input[type=checkbox] {
            transform: scale(1.5);
        }
    </style>
</head>

<body>

    <!-- UI Layer (Always on top) -->
    <div id="ui-layer">
        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <div id="loading-text">Loading Gallery... 0%</div>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-stats"
                style="margin-top: 10px; font-family: monospace; color: #888; font-size: 0.9em; text-align: center;">
                <div id="loading-file">Initializing...</div>
                <div>
                    <span id="loading-data">0.00 MB</span> |
                    <span id="loading-speed">0 KB/s</span>
                </div>
            </div>
        </div>

        <h1 id="title"></h1>
        <div id="fps-counter"
            style="position: fixed; top: 10px; left: 10px; font-size: 0.8em; opacity: 0.7; z-index: 100; font-family: monospace;">
            FPS: 60</div>


        <!-- Toggle Switch -->
        <div id="top-controls">
            <button id="global-fullscreen" title="Go Fullscreen">⛶</button>
            <button id="mode-toggle">3D</button>
            <button id="settings-toggle" title="Settings">⚙️</button>

            <!-- Navigation Hints / Arrows (Optional, can be hidden in 3D if preferred, but good for unified UX) -->
            <button id="leftArrow" class="nav-arrow">❮</button>
            <button id="rightArrow" class="nav-arrow">❯</button>

            <!-- Home / Footer -->
            <footer>
                <h2>@<a href="https://timothydo.me/photography" target="_blank">TheDoShoots</a> 2025. By Timothy Do. All
                    Rights Reserved.</h2>
                <button id="home" onclick="window.location.href='../index.html'">🏠</button>
            </footer>
        </div>

        <!-- 3D View Container -->
        <div id="gallery-3d"></div>

        <!-- 2D View Container -->
        <div id="gallery-2d"></div>

        <!-- 2D Fullscreen Viewer Overlay (classic behavior) -->
        <div id="imageViewer" hidden>
            <!-- Controls Container -->
            <div id="viewer-controls">
                <button id="toggleThumbs" title="Toggle Palette">🖼️</button>
                <button id="toggleMetadata" title="Info">ℹ️</button>
                <button id="fullscreenToggle" title="Fullscreen">⛶</button>
                <button id="exitViewer" title="Close">✖️</button>
            </div>

            <div id="full-image-container"></div>
            <div id="thumbnail-selector" class="visible"></div>
        </div>

        <!-- Metadata Overlay (Moved to root for correct Z-index) -->
        <div id="metadataViewer" class="hidden"></div>

        <!-- Light Pollution Map Overlay (Iframe) -->
        <div id="lightPollutionMapOverlay">
            <div id="lightPollutionMapContainer">
                <iframe id="lightPollutionMapIframe" frameborder="0" scrolling="no"></iframe>
                <button id="lightPollutionMapCloseButton">✖️</button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="hidden">
            <div class="modal-content">
                <h2>Settings</h2>
                <button id="close-settings" class="close-btn">✖️</button>

                <div class="setting-item">
                    <label for="gallery-mode-toggle">3D Galaxy Mode</label>
                    <input type="checkbox" id="gallery-mode-toggle" checked>
                </div>

                <div class="setting-item">
                    <label for="gallery-datasaver-toggle">Data Saver (Low Res)</label>
                    <input type="checkbox" id="gallery-datasaver-toggle">
                </div>

                <p style="font-size: 0.8em; color: #888; margin-top: 20px;">Changes saved automatically.</p>
            </div>
        </div>

        <!-- App JS -->
        <script type="module" src="js/app.js"></script>
</body>

</html>
