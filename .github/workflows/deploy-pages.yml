name: TheDoShoots Photography Portfolio Github Pages Deployment

on:
  push:
    branches:
      - main
  # Allows manual triggering from the Actions tab in GitHub
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Bump this when image-processing behavior or output settings change.
      PORTFOLIO_CACHE_VERSION: v1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Builder Dependencies
        run: make install

      - name: Download Current Portfolio Manifest
        run: |
          .venv/bin/python modules/downloader.py download \
            --id 1PrLEoVooon_-rOZRGzH1BuZbNWLaHDqV \
            --output .cache/manifest/portfolio.csv
          test -s .cache/manifest/portfolio.csv

      - name: Restore Processed Portfolio Cache
        id: portfolio-cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/images
            assets/portfolio.csv
            build/portfolios
            tmp/gallery
          key: ${{ runner.os }}-portfolio-${{ env.PORTFOLIO_CACHE_VERSION }}-${{ hashFiles('.cache/manifest/portfolio.csv', 'assets/watermark.png', 'requirements.txt') }}

      - name: Build TheDoShoots Photography Portfolio
        if: steps.portfolio-cache.outputs.cache-hit != 'true'
        run: make build

      - name: Update Cached Photography Portfolio
        if: steps.portfolio-cache.outputs.cache-hit == 'true'
        run: make incremental

      - name: Display & Expose Build Logs
        if: always()
        run: |
          cat logs/build.log
          cp logs/build.log build/build.log

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'
          
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
