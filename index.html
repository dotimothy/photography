<!doctype html>
<html>

<head>
    <title>TheDoShoots</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto:300,500,700' rel='stylesheet' type='text/css'>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
</head>

<base target="_blank">

<style>
    * {
        font-family: 'Roboto', sans-serif;
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #050505;
        overflow: hidden;
    }

    /* 2D Mode Container (Fallback) */
    #mode-2d {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        min-height: 100%;
        display: none;
        flex-direction: column;
        background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('./assets/photographer.jpg') no-repeat center center/cover fixed;
        overflow-y: auto;
    }

    #mode-2d.active {
        display: flex;
    }

    /* 3D Mode Container */
    #mode-3d {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    #fps-counter {
        position: fixed;
        top: 10px;
        left: 10px;
        font-family: monospace;
        font-weight: bold;
        color: lime;
        z-index: 9999;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px;
        border-radius: 4px;
    }

    /* UI Overlay for 3D Mode */
    #ui-3d {
        position: absolute;
        bottom: 30px;
        right: 30px;
        z-index: 100;
        display: none;
        /* Potentially unused now that we have on-screen UI, but keeping container */
    }

    #ui-3d button {
        background: rgba(10, 10, 10, 0.8);
        border: 1px solid #333;
        color: #888;
        cursor: pointer;
        padding: 12px;
        border-radius: 50%;
        transition: 0.3s;
    }

    #ui-3d button:hover {
        color: #ffffff;
        border-color: #ffffff;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    /* Iframe & Settings (Standard) */
    .iframe-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 3000;
        opacity: 0;
        visibility: hidden;
        transition: 0.4s;
    }

    .iframe-overlay iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .close-button {
        position: absolute;
        top: 30px;
        left: 30px;
        width: 50px;
        height: 50px;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        color: white;
        font-size: 2em;
        line-height: 46px;
        /* Center 'x' vertically (50 - 2 border - 2 padding approx) */
        text-align: center;
        cursor: pointer;
        z-index: 3001;
        transition: 0.3s;
        backdrop-filter: blur(5px);
    }

    .close-button:hover {
        background: rgba(0, 255, 255, 0.2);
        border-color: #00ffff;
        color: #00ffff;
        transform: scale(1.1);
    }

    .settings-panel {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 4000;
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
    }

    .settings-content {
        background: #111;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 2em;
        color: white;
        width: 90%;
        max-width: 400px;
    }

    .settings-content h2 {
        color: #ffffff;
        text-align: center;
    }

    .setting-item {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .setting-item input[type="checkbox"] {
        appearance: none;
        width: 50px;
        height: 26px;
        background: #333;
        border-radius: 20px;
        position: relative;
        cursor: pointer;
    }

    .setting-item input[type="checkbox"]:checked {
        background: #ffffff;
    }

    .setting-item input[type="checkbox"]::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        transition: 0.3s;
    }

    .setting-item input[type="checkbox"]:checked::after {
        transform: translateX(24px);
    }

    .settings-close-button {
        position: absolute;
        top: 10px;
        right: 15px;
        color: #666;
        font-size: 2em;
        background: none;
        border: none;
        cursor: pointer;
    }

    /* 2D Fallback Styles */
    .hero-section {
        text-align: center;
        color: white;
        padding: 50px;
    }

    .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
    }

    .nav-item {
        display: block;
        padding: 20px;
        border: 2px solid white;
        color: white;
        text-decoration: none;
        font-weight: 700;
        font-size: 1.5em;
        transition: 0.3s;
        text-transform: uppercase;
    }

    .nav-item:hover {
        background: white;
        color: black;
    }

    .settings-btn-2d {
        margin-top: 40px;
        background: transparent;
        border: 1px solid #666;
        color: #888;
        padding: 15px 30px;
        font-size: 1em;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 30px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
        margin-right: auto;
    }

    .settings-btn-2d:hover {
        border-color: white;
        color: white;
    }

    .social-icons {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-top: 30px;
    }

    .social-logo {
        color: white;
        font-size: 3em;
    }

    footer {
        text-align: center;
        ``` color: #666;
        padding: 20px;
        margin-top: auto;
    }

    /* FPS Overlay */
    #fps-counter {
        position: fixed;
        bottom: 10px;
        right: 10px;
        color: #00ffff;
        font-family: 'Roboto Mono', monospace;
        font-size: 0.9em;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px 10px;
        border-radius: 5px;
    }

    /* Welcome Screen Styles */
    #welcome-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5000;
        pointer-events: auto;
        /* Using backdrop-filter? Maybe. No, let's keep it clean transparent to see stars */
        background: rgba(0, 0, 0, 0.2);
        transition: opacity 1.5s ease-in-out;
    }

    .welcome-content {
        text-align: center;
        color: white;
        opacity: 0;
        animation: fadeIn 2s forwards 0.5s;
    }

    .welcome-content h1 {
        font-size: 4em;
        font-weight: 700;
        margin: 0;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    .welcome-content h2 {
        font-size: 1.5em;
        font-weight: 300;
        margin-top: 10px;
        margin-bottom: 40px;
        opacity: 0.8;
    }

    .welcome-content button {
        background: transparent;
        border: 2px solid white;
        color: white;
        padding: 15px 40px;
        font-size: 1.2em;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.3s;
    }

    .welcome-content button:hover {
        background: white;
        color: black;
        box-shadow: 0 0 20px white;
    }

    @keyframes fadeIn {
        to {
            opacity: 1;
        }
    }
</style>

<body>

    <!-- 3D Container -->
    <div id="mode-3d"></div>

    <!-- 3D UI -->
    <div id="ui-3d">
        <button id="settingsToggle3d" style="display:none;"><i class="fas fa-cog fa-lg"></i></button>
        <!-- Hidden as we have on-screen settings -->
    </div>

    <!-- WELCOME / LANDING SCREEN -->
    <div id="welcome-screen">
        <div class="welcome-content">
            <h1>Welcome to TheDoShoots</h1>
            <h2>By Timothy Do</h2>
            <button onclick="explore()">EXPLORE</button>
        </div>
    </div>

    <!-- 3D Global Footer -->
    <div id="footer-3d"
        style="position:fixed; bottom:10px; width:100%; text-align:center; color:#666; font-family:'Roboto',sans-serif; pointer-events:none;">
        &copy; 2025 Timothy Do. All Rights Reserved
    </div>

    <!-- 2D Mode (Monochromatic Theme) -->
    <div id="mode-2d">
        <div class="hero-section">
            <h1 style="font-size: 4em; font-weight: 700; margin-bottom: 0.5em;">TheDoShoots</h1>

            <div class="nav-menu">
                <a href="#" id="nav-about-2d" class="nav-item">ABOUT</a>
                <a href="#" id="nav-astro-2d" class="nav-item">ASTROPHOTOGRAPHY</a>
                <a href="#" id="nav-wildlife-2d" class="nav-item">WILDLIFE</a>
            </div>

            <div class="social-icons" style="margin-top: 50px;">
                <a class="social-logo" href="https://instagram.com/thedoshoots" target="_blank"><i
                        class="fab fa-instagram"></i></a>
                <a class="social-logo" href="https://flickr.com" target="_blank"><i class="fab fa-flickr"></i></a>
                <a class="social-logo" href="mailto:tim@example.com"><i class="fas fa-envelope"></i></a>
            </div>

            <button id="settingsToggle" class="settings-btn-2d">
                <i class="fas fa-cog"></i> SETTINGS
            </button>
        </div>
        <footer>@TheDoShoots 2025. By Timothy Do. All Rights Reserved.</footer>
    </div>

    <!-- FPS Overlay -->
    <div id="fps-counter">FPS: 60</div>

    <!-- Overlays -->
    <div class="iframe-overlay" id="galleryOverlay">
        <button class="close-button" id="closeGallery">×</button>
        <iframe id="galleryIframe" src="" frameborder="0"></iframe>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content">
            <button class="settings-close-button" id="closeSettings">×</button>
            <h2>SETTINGS</h2>
            <div class="setting-item">
                <label for="mode3dToggle">3D Camera View</label>
                <input type="checkbox" id="mode3dToggle" checked>
            </div>
            <div class="setting-item"><label for="galleryToggle">Gallery Mode</label><input type="checkbox"
                    id="galleryToggle"></div>
            <div class="setting-item"><label for="datasaverToggle">Data Saver</label><input type="checkbox"
                    id="datasaverToggle"></div>
            <div class="setting-item"><label for="directLinksToggle">Direct Links</label><input type="checkbox"
                    id="directLinksToggle"></div>
        </div>
    </div>

    <script>
        // --- TEXTURE GENERATION ---

        // 1. Leather Texture (Noise)
        function createLeatherTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Base dark grey
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, 1024, 1024);

            // Noise
            for (let i = 0; i < 300000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(50,50,50,0.1)';
                ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
            }

            // Pattern (Grip dots)
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            for (let y = 0; y < 1024; y += 10) {
                for (let x = 0; x < 1024; x += 10) {
                    if (Math.random() > 0.2) ctx.fillRect(x, y, 4, 4);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // 2. Brushed Metal Texture
        function createMetalTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Gradient
            const grad = ctx.createLinearGradient(0, 0, 512, 512);
            grad.addColorStop(0, '#222');
            grad.addColorStop(0.5, '#444');
            grad.addColorStop(1, '#222');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);

            // Scratches
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let i = 0; i < 500; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * 512, Math.random() * 512);
                ctx.lineTo(Math.random() * 512, Math.random() * 512);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // 3. UI Screen Texture (The Interface)
        // Moved to later in the file (lines ~860) to support 1280x850 resolution.

        // --- 3D SCENE ---
        let scene, camera, renderer;
        let screenMesh, camGroup, starSystem;
        let raycaster, mouse;
        let is3DActive = true;
        let hasExplored = false;
        let animationId;

        // FPS Stats
        let lastTime = performance.now();
        let frameCount = 0;
        const fpsElem = document.getElementById('fps-counter');

        // Raycast Targets
        let buttonPlanes = [];

        // Zoom Logic
        let targetZoom = 18; // Default to Zoomed Out (Body visible)
        const minZoom = 6;
        const maxZoom = 25;

        document.addEventListener('DOMContentLoaded', () => {
            const mode3dToggle = document.getElementById('mode3dToggle');
            const galleryToggle = document.getElementById('galleryToggle');
            const datasaverToggle = document.getElementById('datasaverToggle');
            const directLinksToggle = document.getElementById('directLinksToggle');

            function loadSettings() {
                is3DActive = (localStorage.getItem('mode3dToggle') !== 'false');
                mode3dToggle.checked = is3DActive;
                applyMode();
            }

            function applyMode() {
                const ui3d = document.getElementById('ui-3d');
                const m2 = document.getElementById('mode-2d');
                const m3 = document.getElementById('mode-3d');

                if (is3DActive) {
                    m2.classList.remove('active');
                    m3.style.display = 'block';
                    // Only hide UI if we haven't explored yet
                    ui3d.style.display = hasExplored ? 'block' : 'none';
                    init3D();
                    animate(); // Call animate when 3D is active
                } else {
                    m2.classList.add('active');
                    m3.style.display = 'none';
                    ui3d.style.display = 'none';
                    cancelAnimationFrame(animationId);
                }
            }

            // --- ANIMATE LOOP ---
            function animate() {
                animationId = requestAnimationFrame(animate);

                // Update Tweens (if TWEEN library is used)
                if (typeof TWEEN !== 'undefined') {
                    TWEEN.update();
                }

                // FPS Counter
                const now = performance.now();
                frameCount++;
                if (now - lastTime >= 1000) {
                    if (fpsElem) fpsElem.innerText = `FPS: ${frameCount}`;
                    frameCount = 0;
                    lastTime = now;
                }

                if (!scene || !camera || !renderer) return; // Ensure scene is initialized

                // Update controls if they exist
                if (scene.userData.controls) {
                    scene.userData.controls.update();
                }

                renderer.render(scene, camera);
            }

            // --- INIT 3D ---
            function init3D() {
                if (scene) return; // Prevent re-initialization
                scene = new THREE.Scene();

                // Camera setup for "Handheld" feel
                camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
                // Start FAR away (in the stars)
                camera.position.set(0, 0, 80);
                camera.lookAt(0, 0, 0);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.getElementById('mode-3d').appendChild(renderer.domElement);

                // Lighting
                const ambient = new THREE.AmbientLight(0xffffff, 0.4);
                scene.add(ambient);
                const spot = new THREE.SpotLight(0xffffff, 1);
                spot.position.set(5, 10, 10);
                spot.castShadow = true;
                scene.add(spot);
                const blueRim = new THREE.PointLight(0x00ffff, 0.8);
                blueRim.position.set(-10, 0, 5);
                scene.add(blueRim);

                // --- BACKGROUND ---
                createStarfield();

                // --- CONTROLS ---
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.minDistance = 5;
                controls.maxDistance = 50;

                scene.userData.controls = controls; // Store for animate loop

                // --- CAMERA MODEL ---
                camGroup = new THREE.Group();
                camGroup.visible = false; // Hidden until Explore
                scene.add(camGroup);

                const leatherTex = createLeatherTexture();
                const metalTex = createMetalTexture();

                const leatherMat = new THREE.MeshStandardMaterial({
                    map: leatherTex, roughness: 0.9, color: 0x333333
                });
                const metalMat = new THREE.MeshStandardMaterial({
                    map: metalTex, roughness: 0.3, metalness: 0.8, color: 0x888888
                });
                const blackPlasticMat = new THREE.MeshStandardMaterial({
                    color: 0x111111, roughness: 0.5
                });

                // 1. Main Body (Back)
                const bodyGeo = new THREE.BoxGeometry(14, 10, 4);
                const body = new THREE.Mesh(bodyGeo, leatherMat);
                camGroup.add(body);

                // 2. LCD Screen Frame (Resized LARGER)
                const screenFrameGeo = new THREE.BoxGeometry(13.5, 9.5, 0.5); // Wider/Taller
                const screenFrame = new THREE.Mesh(screenFrameGeo, blackPlasticMat);
                screenFrame.position.set(0, -0.5, 2);
                camGroup.add(screenFrame);

                // 3. The LCD Screen (Canvas)
                const uiTex = createUIScreen();
                const screenGeo = new THREE.PlaneGeometry(12.8, 8.5); // Matches new frame
                const screenMat = new THREE.MeshBasicMaterial({ map: uiTex });
                screenMesh = new THREE.Mesh(screenGeo, screenMat);
                screenMesh.position.set(0, -0.5, 2.26);
                camGroup.add(screenMesh);

                // 4. Lens (Front)
                const lensGeo = new THREE.CylinderGeometry(3.5, 3.5, 3, 32);
                const lens = new THREE.Mesh(lensGeo, blackPlasticMat);
                lens.rotation.x = Math.PI / 2;
                lens.position.set(0, 0, -3.5); // Extend from center (Z=0) towards front (Z negative)
                camGroup.add(lens);

                // Lens Glass
                const glassGeo = new THREE.CylinderGeometry(3, 3, 0.2, 32);
                const glassMat = new THREE.MeshPhysicalMaterial({
                    color: 0x111111, metalness: 0.9, roughness: 0.1,
                    transparent: true, opacity: 0.8, transmission: 0.5
                });
                const glass = new THREE.Mesh(glassGeo, glassMat);
                glass.rotation.x = Math.PI / 2;
                glass.position.set(0, 0, -5.1);
                camGroup.add(glass);

                // 5. Grip (Right side looking from back = Left side from front)
                // Position X = -8
                const gripGeo = new THREE.BoxGeometry(4, 9, 5);
                const grip = new THREE.Mesh(gripGeo, leatherMat);
                grip.position.set(-8, -0.5, 0.5);
                camGroup.add(grip);

                // ... (rest of geometry code unchanged)

                // --- DYNAMIC INTERACTION ZONES ---
                // We no longer use static planes. We check click coordinates against UI state.

                // --- INTERACTION ---
                raycaster = new THREE.Raycaster();
                mouse = new THREE.Vector2();

                // Zoom Logic (Initialized globally)
                // We no longer use static planes. We check click coordinates against UI state.

                // Zoom Logic (Initialized globally)

                window.addEventListener('resize', onResize);
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('click', onClick);
                document.addEventListener('wheel', onWheel, { passive: false });
            }

            function onResize() {
                if (camera) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            }

            function onWheel(e) {
                // Let OrbitControls handle Zoom
                // But we want to clamp it? OrbitControls.minDistance handles that.
                // We can remove this custom logic OR keep it if we want to update a UI slider.
                // For now, let's remove the custom targetZoom logic to avoid conflict.
            }

            function createStarfield() {
                const geometry = new THREE.BufferGeometry();
                const count = 5000; // More stars
                const posArray = new Float32Array(count * 3);
                for (let i = 0; i < count * 3; i++) {
                    posArray[i] = (Math.random() - 0.5) * 400; // Wider spread (400)
                }
                geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                const material = new THREE.PointsMaterial({
                    size: 0.2, color: 0xffffff, transparent: true, opacity: 0.8
                });
                starSystem = new THREE.Points(geometry, material);
                scene.add(starSystem);
            }

            // --- UI STATE MANAGEMENT ---
            let currentScreen = 'HOME'; // 'HOME' | 'SETTINGS'
            let uiClickZones = []; // [{x, y, w, h, action: fn}]

            // 3. UI Screen Logic
            let uiCanvas, uiCtx, uiTexture;
            let pfpImage = new Image();

            function createUIScreen() {
                uiCanvas = document.createElement('canvas');
                uiCanvas.width = 1280; uiCanvas.height = 850; // New Res: 1280x850
                uiCtx = uiCanvas.getContext('2d');

                pfpImage.src = './assets/photographer.jpg';
                pfpImage.onload = updateUI;

                document.fonts.load("700 80px Roboto").then(updateUI);
                document.fonts.load("900 40px 'Font Awesome 5 Brands'").then(updateUI);
                document.fonts.load("900 40px 'Font Awesome 5 Free'").then(updateUI);

                updateUI();

                uiTexture = new THREE.CanvasTexture(uiCanvas);
                return uiTexture;
            }

            function updateUI() {
                uiClickZones = []; // Reset zones

                // BG
                uiCtx.fillStyle = '#050505';
                uiCtx.fillRect(0, 0, 1280, 850);

                // Grid
                drawGrid();

                // Status Bar (Common)
                drawStatusBar();

                document.getElementById('footer-3d').style.display = 'none'; // Hide by default
                if (currentScreen === 'HOME') {
                    // Update 3D footer visibility (show)
                    document.getElementById('footer-3d').style.display = 'block';
                    drawHome();
                } else {
                    drawSettings();
                }

                if (uiTexture) uiTexture.needsUpdate = true;
            }

            function drawGrid() {
                uiCtx.strokeStyle = 'rgba(255,255,255,0.08)';
                uiCtx.lineWidth = 2;
                uiCtx.beginPath();
                // Roughly thirds
                uiCtx.moveTo(426, 0); uiCtx.lineTo(426, 850);
                uiCtx.moveTo(853, 0); uiCtx.lineTo(853, 850);
                uiCtx.moveTo(0, 283); uiCtx.lineTo(1280, 283);
                uiCtx.moveTo(0, 566); uiCtx.lineTo(1280, 566);
                uiCtx.stroke();
            }

            function drawHome() {
                // Header

                // Note: Renamed "ASTRO" to "KEYBOARD" in user request? No, user just complained about layout. I'll stick to original links but better layout.

                // Better yet, just redraw correctly.

                uiCtx.textAlign = 'left';
                uiCtx.fillStyle = '#fff';
                uiCtx.font = '900 60px "Font Awesome 5 Brands"';

                // IG
                uiCtx.fillText('\uf16d', 80, socialY);
                addZone(80, socialY - 50, 60, 60, () => window.open('https://instagram.com/thedoshoots', '_blank'));

                // Flickr

                addZone(180, socialY - 50, 60, 60, () => window.open('https://flickr.com', '_blank'));

                // Email (Solid)
                uiCtx.font = '900 60px "Font Awesome 5 Free"';
                uiCtx.fillText('\uf0e0', 280, socialY);
                addZone(280, socialY - 50, 60, 60, () => window.open('mailto:tim@example.com', '_blank'));
            }

            function drawSettings() {
                // Header
                uiCtx.fillStyle = '#ffffff';
                uiCtx.font = '700 80px "Roboto", sans-serif';
                uiCtx.textAlign = 'left';
                uiCtx.textBaseline = 'top';
                uiCtx.fillText('SETTINGS', 80, 80);

                const startY = 250;
                const lineHeight = 120;

                drawToggleOption("3D Mode", startY, 'mode3dToggle');
                drawToggleOption("Gallery Mode", startY + lineHeight, 'galleryToggle');
                drawToggleOption("Data Saver", startY + lineHeight * 2, 'datasaverToggle');

                // Back Button
                drawButton("BACK", "\uf060", 80, 650, 300, 100, () => { currentScreen = 'HOME'; updateUI(); });
            }

            function drawToggleOption(label, y, id) {
                const el = document.getElementById(id);
                const isChecked = el ? el.checked : false;

                uiCtx.fillStyle = '#fff';
                uiCtx.font = '500 50px "Roboto", sans-serif';
                uiCtx.textAlign = 'left';
                uiCtx.fillText(label, 120, y + 40);

                // Toggle Switch UI
                const swX = 900, swY = y, swW = 120, swH = 60;
                uiCtx.fillStyle = isChecked ? '#ffffff' : '#333';
                uiCtx.beginPath();
                uiCtx.roundRect(swX, swY, swW, swH, 30);
                uiCtx.fill();

                // Knob
                uiCtx.fillStyle = isChecked ? '#000' : '#fff'; // Invert knob color for contrast
                uiCtx.beginPath();
                const kX = isChecked ? swX + swW - 55 : swX + 5;
                uiCtx.arc(kX + 25, swY + 30, 25, 0, Math.PI * 2);
                uiCtx.fill();

                addZone(swX, swY, swW, swH, () => {
                    if (el) {
                        el.click(); // Trigger native click to handle logic
                        updateUI(); // Redraw
                    }
                });
            }

            function drawStatusBar() {
                uiCtx.fillStyle = '#ffffff';
                uiCtx.font = '500 35px monospace';
                uiCtx.textAlign = 'left';
                uiCtx.textBaseline = 'bottom';
                const y = 830;
                uiCtx.fillText("[RAW]  ISO 1600  1/500  f/2.8", 80, y);

                // Battery
                uiCtx.strokeStyle = '#fff';
                uiCtx.lineWidth = 3;
                uiCtx.strokeRect(1150, 795, 80, 40);
                uiCtx.fillRect(1230, 805, 6, 20);
                uiCtx.fillStyle = '#ffffff';
                uiCtx.fillRect(1156, 801, 50, 28);
            }

            function drawProfilePic() {
                const x = 250, y = 450, radius = 160; // Bigger PFP

                uiCtx.save();
                uiCtx.shadowColor = '#ffffff';
                uiCtx.shadowBlur = 40;
                uiCtx.fillStyle = '#000';
                uiCtx.beginPath(); uiCtx.arc(x, y, radius - 2, 0, Math.PI * 2); uiCtx.fill();
                uiCtx.shadowBlur = 0;

                uiCtx.beginPath(); uiCtx.arc(x, y, radius, 0, Math.PI * 2); uiCtx.closePath(); uiCtx.clip();

                if (pfpImage.complete) {
                    uiCtx.drawImage(pfpImage, x - radius, y - radius, radius * 2, radius * 2);
                } else {
                    uiCtx.fillStyle = '#222'; uiCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
                }
                uiCtx.restore();

                uiCtx.save();
                uiCtx.lineWidth = 8; uiCtx.strokeStyle = '#ffffff';
                uiCtx.beginPath(); uiCtx.arc(x, y, radius, 0, Math.PI * 2); uiCtx.stroke();
                uiCtx.restore();
            }

            function drawButton(text, icon, x, y, w, h, action) {
                uiCtx.fillStyle = 'rgba(20, 20, 20, 1)';
                uiCtx.fillRect(x, y, w, h);
                uiCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                uiCtx.lineWidth = 3;
                uiCtx.strokeRect(x, y, w, h);

                // Icon
                if (icon) {
                    uiCtx.fillStyle = '#00ffff';
                    uiCtx.font = '900 50px "Font Awesome 5 Free"';
                    uiCtx.textAlign = 'center';
                    uiCtx.textBaseline = 'middle';
                    uiCtx.fillText(icon, x + 60, y + h / 2);
                }

                uiCtx.fillStyle = '#fff';
                uiCtx.font = '700 60px "Roboto", sans-serif';
                uiCtx.textAlign = 'left'; // Align left next to icon
                uiCtx.textBaseline = 'middle';

                const textX = icon ? x + 130 : x + w / 2;
                const align = icon ? 'left' : 'center';
                uiCtx.textAlign = align;

                uiCtx.fillText(text, textX, y + h / 2);

                uiCtx.fillStyle = '#ffffff';
                uiCtx.fillRect(x, y, 15, h); // Decor bar

                // Add Click Zone
                addZone(x, y, w, h, action);
            }

            function addZone(canvasX, canvasY, w, h, action) {
                // Map Canvas Coords to 0-1 Plane Coords
                // Canvas is 1280 x 850
                // Plane is 12.8 x 8.5
                // Center is (640, 425) -> (0,0) in 3D

                uiClickZones.push({
                    x: canvasX, y: canvasY, w: w, h: h, action: action
                });
            }

            // Updated Interaction Logic
            function onClick() {
                if (!is3DActive) return;

                if (camera.position.z < 18) { // Clickable range
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(screenMesh);

                    if (intersects.length > 0) {
                        const uv = intersects[0].uv;
                        // UV is 0..1 (bottom-left to top-right typically, wait, Three.js PlaneGeometry matches image)
                        // UV (0,0) = Bottom-Left ? No, Top-Left usually for canvas?
                        // Texture UV: (0,0) is Bottom-Left. Canvas (0,0) is Top-Left.
                        // So UV.y = 1 - (CanvasY / Height)

                        const clickX = uv.x * 1280;
                        const clickY = (1 - uv.y) * 850;

                        // Check zones
                        for (let zone of uiClickZones) {
                            if (clickX >= zone.x && clickX <= zone.x + zone.w &&
                                clickY >= zone.y && clickY <= zone.y + zone.h) {
                                zone.action();
                                break;
                            }
                        }
                    }
                }
            }

            // Cursor Hover
            // Cursor Hover
            function onMouseMove(e) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                if (is3DActive && camera.position.z < 18) {
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(screenMesh);
                    let hovering = false;

                    if (intersects.length > 0) {
                        const uv = intersects[0].uv;
                        const clickX = uv.x * 1280;
                        const clickY = (1 - uv.y) * 850;

                        for (let zone of uiClickZones) {
                            if (clickX >= zone.x && clickX <= zone.x + zone.w &&
                                clickY >= zone.y && clickY <= zone.y + zone.h) {
                                hovering = true;
                                break;
                            }
                        }
                    }
                    document.body.style.cursor = hovering ? 'pointer' : 'default';
                }
            }

            function handleNav(url, isInternal) {
                const finalUrl = buildUrl(url);
                if (directLinksToggle.checked || !isInternal) {
                    window.open(finalUrl, '_blank');
                } else {
                    document.getElementById('galleryIframe').src = finalUrl;
                    document.getElementById('galleryOverlay').style.visibility = 'visible';
                    document.getElementById('galleryOverlay').style.opacity = '1';
                }
            }

            function buildUrl(base) {
                const url = new URL(base, window.location);
                if (galleryToggle.checked) url.searchParams.set('gallery', 'true');
                if (datasaverToggle.checked) url.searchParams.set('datasaver', 'true');
                if (directLinksToggle.checked) url.searchParams.set('directlinks', 'true');
                return url.toString();
            }

            function animate() {
                animationId = requestAnimationFrame(animate);
                if (uiTexture) uiTexture.needsUpdate = true; // Refresh for pfp load

                if (uiTexture) uiTexture.needsUpdate = true; // Refresh for pfp load

                // No manual zoom interpolation needed if Controls are used.
                // Controls update automatically if enableDamping is on, we need controls.update()
                // But controls is local variable in init3D...
                // We need to access controls globally or just let it be?
                // Wait, controls.enableDamping REQUIRES update() in loop.
                // I made 'const controls' in init3D. I need 'controls' variable to be global.
                // Quick fix: Attach controls to window or make global

                // Let's rely on standard orbit for now without damping or re-query.
                // Actually, better: 
                if (scene && scene.userData.controls) scene.userData.controls.update();

                if (starSystem) {
                    starSystem.rotation.y += 0.0005; // Slow rotation
                    starSystem.rotation.x += 0.0002;
                }

                renderer.render(scene, camera);
                TWEEN.update();
            }

            // --- SETTINGS BINDINGS ---
            mode3dToggle.addEventListener('change', (e) => {
                localStorage.setItem('mode3dToggle', e.target.checked);
                location.reload();
            });
            galleryToggle.addEventListener('change', updateUI);
            datasaverToggle.addEventListener('change', updateUI);
            directLinksToggle.addEventListener('change', updateUI);

            // Overlays
            document.getElementById('closeGallery').addEventListener('click', () => {
                document.getElementById('galleryOverlay').style.opacity = 0;
                setTimeout(() => document.getElementById('galleryOverlay').style.visibility = 'hidden', 400);
            });
            document.getElementById('settingsToggle3d').addEventListener('click', () => {
                document.getElementById('settingsPanel').style.visibility = 'visible';
                document.getElementById('settingsPanel').style.opacity = 1;
            });
            // 2D Settings Toggle Listener
            document.getElementById('settingsToggle').addEventListener('click', () => {
                document.getElementById('settingsPanel').style.visibility = 'visible';
                document.getElementById('settingsPanel').style.opacity = 1;
            });

            // 2D Nav Listeners
            document.getElementById('nav-about-2d').addEventListener('click', (e) => { e.preventDefault(); handleNav('./about.html', true); });
            document.getElementById('nav-astro-2d').addEventListener('click', (e) => { e.preventDefault(); handleNav('./astronomy/index.html', true); });
            document.getElementById('nav-wildlife-2d').addEventListener('click', (e) => { e.preventDefault(); handleNav('./wildlife/index.html', true); });

            document.getElementById('closeSettings').addEventListener('click', () => {
                document.getElementById('settingsPanel').style.opacity = 0;
                setTimeout(() => document.getElementById('settingsPanel').style.visibility = 'hidden', 300);
            });

            loadSettings();
        });

        // --- EXPLORE ANIMATION ---
        window.explore = function () {
            console.log("Explore clicked!");
            const welcome = document.getElementById('welcome-screen');
            if (welcome) {
                welcome.style.opacity = 0;
                setTimeout(() => { welcome.style.display = 'none'; }, 1500);
            }

            // Animate Camera
            // Animate Camera
            if (!camera) {
                console.error("Camera not initialized");
                return;
            }

            // Show Camera Model
            if (camGroup) camGroup.visible = true;
            hasExplored = true;

            console.log("Starting Tween from", camera.position.z);

            new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 0, z: 10 }, 2500) // 2.5s fly-in
                .easing(TWEEN.Easing.Cubic.InOut)
                .onComplete(() => {
                    console.log("Tween Complete");
                    const ui3d = document.getElementById('ui-3d');
                    if (ui3d) ui3d.style.display = 'block';
                })
                .start();

            new TWEEN.Tween(camera.rotation)
                .to({ z: 0 }, 2000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .start();
        };
    </script>
