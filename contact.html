<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080c14">
    <title>Contact | TheDoShoots</title>
    <link rel="stylesheet" href="./assets/css/contact.css">
    <script src="./assets/js/contact.js" defer></script>
</head>
<body>
    <a class="contact-control" id="contact-back" href="./index.html" target="_top">Back To Portfolio</a>
    <main>
        <img src="./assets/watermark.png" alt="TheDoShoots" class="contact-signature">
        <h1>Let’s Make Something</h1>
        <div class="contact-actions" role="group" aria-label="Inquiry Type" id="inquiry-types" hidden>
            <button class="contact-control" type="button" data-inquiry="sessions" aria-pressed="false">Photoshoots / Sessions</button>
            <button class="contact-control" type="button" data-inquiry="prints" aria-pressed="false">Prints</button>
            <button class="contact-control" type="button" data-inquiry="licensing" aria-pressed="false">Licensing</button>
            <button class="contact-control" type="button" data-inquiry="collaboration" aria-pressed="false">Collaboration</button>
        </div>
        <p id="contact-frame" hidden></p>
        <p class="contact-address" id="contact-address">contact@thedoshoots.me</p>
        <div class="contact-actions">
            <a class="contact-control" id="contact-mail" href="mailto:contact@thedoshoots.me">Open In Mail</a>
            <button class="contact-control" id="contact-copy" type="button" hidden>Copy Address</button>
        </div>
        <p class="contact-status" id="contact-status" role="status"></p>
        <div class="contact-actions">
            <a class="contact-text-link" href="https://forms.gle/KvaUyizYpwuKnF868" target="_blank" rel="noopener">Use The Form Instead</a>
            <a class="contact-text-link" href="https://thedoshoots.pixieset.com/" target="_blank" rel="noopener" id="contact-prints">Browse Prints</a>
        </div>
        <nav class="contact-actions contact-socials" aria-label="Social Links">
            <a class="contact-text-link" href="https://instagram.com/thedoshoots">Instagram</a>
            <a class="contact-text-link" href="https://www.youtube.com/@TheDoShoots">YouTube</a>
            <a class="contact-text-link" href="https://www.flickr.com/people/169526448@N03/">Flickr</a>
        </nav>
    </main>
</body>
</html>
